<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<title>PosePoint — ความแม่นยำของโมเดล</title>
<style>
  :root{
    --primary:#D97706; --secondary:#F59E0B; --accent:#6366F1;
    --bg:#0F172A; --fg:#FFFFFF; --muted-fg:#CBD5E1; --surface:#161b29;
    --border:rgba(255,255,255,.08); --success:#22C55E; --r:16px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:"Barlow",system-ui,sans-serif; font-size:16px; line-height:1.6;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 40px env(safe-area-inset-left);}
  h1,h2{font-family:"Barlow Condensed","Barlow",sans-serif; letter-spacing:.5px;}
  header{display:flex; align-items:center; gap:12px; padding:14px 16px; background:linear-gradient(120deg,#1a1407,#0F172A 60%);
         border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:22px; font-weight:700; text-transform:uppercase; line-height:1.1;}
  .back{color:var(--muted-fg); text-decoration:none; font-size:22px; line-height:1; padding:6px 8px; border-radius:10px; border:1px solid var(--border);}
  .back:hover{background:var(--surface); color:#fff;}
  .langbtn{margin-left:auto; min-height:38px; padding:0 14px; border-radius:999px; background:var(--surface); color:var(--fg);
           border:1px solid var(--border); font-weight:700; font-size:13px; letter-spacing:.5px; cursor:pointer; font-family:inherit;}
  .langbtn:hover{background:#22283a;}
  main{max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px;}
  .card h2{margin:0 0 4px; font-size:19px; font-weight:600; text-transform:uppercase; color:#fff;}
  .lead{color:var(--muted-fg); font-size:14.5px; margin:0 0 14px;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px;}
  .kpi{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 10px; text-align:center;}
  .kpi .v{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:30px; line-height:1.1; color:var(--secondary); font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:11.5px; color:var(--muted-fg); text-transform:uppercase; letter-spacing:.5px;}
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:15px;}
  th,td{padding:9px 8px; border-bottom:1px solid var(--border); text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  thead th{font-size:12.5px; color:var(--muted-fg); text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
  tbody tr:last-child td{border-bottom:0;}
  td.win{color:var(--success); font-weight:600;}
  .tag{display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px; background:rgba(217,119,6,.18); color:var(--secondary); border:1px solid rgba(217,119,6,.35);}
  figure{margin:0 0 18px;}
  figure:last-of-type{margin-bottom:0;}
  figure img{width:100%; height:auto; display:block; border-radius:12px; background:#fff; border:1px solid var(--border);}
  figcaption{font-size:13.5px; color:var(--muted-fg); margin-top:8px; line-height:1.6;}
  figcaption b{color:var(--secondary); font-weight:600;}
  ul{margin:0; padding-left:20px; color:var(--muted-fg); font-size:14.5px;}
  li{margin-bottom:6px;}
  li b{color:#fff; font-weight:600;}
  dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:14.5px;}
  dt{color:var(--muted-fg);} dd{margin:0; word-break:break-word;}
  .warn{border-left:3px solid var(--secondary); padding-left:12px; color:var(--muted-fg); font-size:14px;}
  .err{color:#ff8787; font-size:14px;}
  a{color:var(--accent);}
  @media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="กลับหน้าหลัก / Back">&#8592;</a>
  <h1 data-th="ความแม่นยำของโมเดล" data-en="Model accuracy"></h1>
  <button id="btnLang" class="langbtn" type="button">EN</button>
</header>

<main>
  <section class="card">
    <h2 data-th="ระบบนี้แม่นแค่ไหน" data-en="How accurate is it?"></h2>
    <p class="lead" data-th="ตัวเลขทั้งหมดในหน้านี้อ่านจากไฟล์โมเดลที่แอปใช้งานจริง และกราฟสร้างจากผลการทดสอบชุดเดียวกัน — ไม่ได้พิมพ์ตัวเลขใส่เอง"
       data-en="Every number here is read from the model file the app actually runs, and the charts come from the same evaluation run — nothing is typed in by hand."></p>
    <div class="kpis" id="kpis"></div>
    <p class="err" id="loadErr" hidden></p>
  </section>

  <section class="card">
    <h2 data-th="เทียบกับวิธีเชิงกฎ" data-en="Versus the rule-based method"></h2>
    <p class="lead" data-th="ทดสอบแบบแบ่งชุดตามคลิป (ครั้งจากคลิปเดียวกันไม่ข้ามชุด) เพื่อกันข้อมูลรั่ว ค่าของโมเดลเป็นค่าเฉลี่ย ± ส่วนเบี่ยงเบนจากการสุ่มแบ่ง 5 รอบ"
       data-en="Evaluated with clip-grouped cross-validation so reps from one clip never span splits. Model values are mean ± SD over 5 shuffles."></p>
    <table>
      <thead><tr>
        <th data-th="ตัวชี้วัด" data-en="Metric"></th>
        <th data-th="วิธีเชิงกฎ" data-en="Rule-based"></th>
        <th data-th="โมเดล ML" data-en="ML model"></th>
      </tr></thead>
      <tbody id="metrics"></tbody>
    </table>
    <p class="lead" style="margin:12px 0 0;" data-th="Precision = เตือนว่าผิดแล้วผิดจริงกี่ %, Recall = ท่าผิดทั้งหมดจับได้กี่ %, F1 = ค่าเฉลี่ยของสองตัวนี้"
       data-en="Precision = of the reps flagged wrong, how many really were. Recall = of all wrong reps, how many were caught. F1 balances the two."></p>
  </section>

  <section class="card">
    <h2 data-th="กราฟผลการทดสอบ" data-en="Evaluation charts"></h2>
    <figure>
      <img src="charts/chart_compare.png" alt="เปรียบเทียบ Precision Recall F1 Accuracy ระหว่างวิธีเชิงกฎกับโมเดล">
      <figcaption data-th="<b>เทียบตัวชี้วัด</b> โมเดลตัดสินแม่นกว่าวิธีเชิงกฎชัดเจนในด้าน Precision และ Accuracy — แปลว่าเตือนพลาดน้อยลงมาก"
                  data-en="<b>Metric comparison.</b> The model clearly beats the rule-based method on precision and accuracy — far fewer false alarms."></figcaption>
    </figure>
    <figure>
      <img src="charts/chart_confusion.png" alt="Confusion matrix ของวิธีเชิงกฎและโมเดล">
      <figcaption data-th="<b>Confusion matrix</b> ช่องขวาบนคือ &quot;เตือนทั้งที่ท่าถูก&quot; ซึ่งโมเดลลดลงได้มาก ส่วนช่องซ้ายล่างคือท่าผิดที่หลุดไป"
                  data-en="<b>Confusion matrix.</b> Top-right is &quot;flagged but actually correct&quot; — the model cuts these sharply. Bottom-left is wrong reps that slipped through."></figcaption>
    </figure>
    <figure>
      <img src="charts/chart_curves.png" alt="ROC curve และ Precision-Recall curve">
      <figcaption data-th="<b>ROC และ Precision–Recall</b> วัดคุณภาพของค่าความน่าจะเป็นที่โมเดลให้ โดยไม่ขึ้นกับจุดตัดที่เลือก"
                  data-en="<b>ROC and precision–recall curves.</b> These judge the quality of the model's probability output independently of the cut-off chosen."></figcaption>
    </figure>
    <figure>
      <img src="charts/chart_importance.png" alt="คุณลักษณะที่โมเดลใช้มากที่สุด">
      <figcaption data-th="<b>คุณลักษณะที่โมเดลใช้มากที่สุด</b> ตรวจสอบได้ว่าโมเดลตัดสินจากมุมของร่างกายจริง ไม่ใช่จากสิ่งแวดล้อมในภาพ"
                  data-en="<b>Most-used features.</b> A check that the model decides from real body angles, not from background cues."></figcaption>
    </figure>
    <figure>
      <img src="charts/chart_threshold.png" alt="ผลของค่าขีดแบ่งมุมเข่าต่อความแม่นยำ">
      <figcaption data-th="<b>การเลือกค่าขีดแบ่ง</b> ทดลองเปลี่ยนค่ามุมเข่าบนชุดปรับค่า แล้วเลือกค่าที่ให้ F1 สูงสุด ไม่ได้ตั้งค่าตามความรู้สึก"
                  data-en="<b>Threshold selection.</b> The knee angle was swept on a tuning split and the best-F1 value kept — not set by gut feeling."></figcaption>
    </figure>
  </section>

  <section class="card">
    <h2 data-th="โมเดลที่แอปใช้อยู่" data-en="The model this app runs"></h2>
    <dl id="modelInfo"></dl>
    <p class="lead" style="margin:14px 0 0;" data-th="โมเดลถูกแปลงเป็นไฟล์ JSON แล้วรันด้วย JavaScript ในเบราว์เซอร์ — วิดีโอไม่ถูกส่งออกจากเครื่อง และใช้งานได้แม้ออฟไลน์"
       data-en="The model is exported to JSON and run by JavaScript in the browser — video never leaves the device, and it works offline."></p>
  </section>

  <section class="card">
    <h2 data-th="ข้อจำกัดที่ต้องบอกตรง ๆ" data-en="Honest limitations"></h2>
    <ul>
      <li data-th="<b>เฉลยเป็นระดับคลิป</b> ไม่ใช่รายครั้ง ทุกครั้งในคลิปเดียวกันจึงได้เฉลยเดียวกัน — ครั้งที่ทำถูกในคลิปที่ติดป้ายว่าผิดจะถูกนับเป็นผิดไปด้วย"
          data-en="<b>Labels are per clip, not per rep.</b> Every rep in a clip inherits the clip's label, so a good rep inside a clip labelled wrong counts as wrong."></li>
      <li data-th="<b>ชุดข้อมูลสาธารณะ</b> ยังไม่ใช่ข้อมูลที่เก็บเอง จำนวนคนและมุมกล้องจึงจำกัด"
          data-en="<b>Public dataset.</b> Not our own recordings yet, so the range of people and camera angles is limited."></li>
      <li data-th="<b>ต้องถ่ายมุมข้างเต็มตัว</b> ถ้ากล้องไม่เห็นสะโพก–เข่า–ข้อเท้า ระบบจะถอยไปใช้เกณฑ์เชิงกฎแทนโมเดล"
          data-en="<b>Needs a full side view.</b> If hip, knee and ankle are not visible the app falls back to the rule-based checks."></li>
      <li data-th="<b>ขั้นต่อไป</b> เก็บข้อมูลเอง 15–20 คน ติดเฉลยรายครั้งพร้อมชนิดของท่าผิด แล้วเทรนใหม่โดยแบ่งชุดทดสอบตามคน"
          data-en="<b>Next step:</b> record 15–20 people ourselves, label every rep with its error type, and retrain with a person-grouped split."></li>
    </ul>
  </section>
</main>

<script>
  const STR = { th: { btn: "EN", locale: "th-TH" }, en: { btn: "TH", locale: "en-US" } };
  let lang = localStorage.getItem("pp_lang") === "en" ? "en" : "th";
  const L = (th, en) => (lang === "en" ? en : th);

  function applyLang() {
    document.documentElement.lang = lang;
    document.getElementById("btnLang").textContent = STR[lang].btn;
    document.querySelectorAll("[data-th]").forEach(el => { el.innerHTML = el.dataset[lang]; });
    if (model) render(model);            // เรนเดอร์ตัวเลขใหม่ตามภาษา
  }
  document.getElementById("btnLang").addEventListener("click", () => {
    lang = lang === "th" ? "en" : "th";
    localStorage.setItem("pp_lang", lang);
    applyLang();
  });

  const pct = (v) => (v * 100).toFixed(0) + "%";
  const num = (v) => v.toFixed(2);

  function cell(row, text, cls) {
    const td = document.createElement("td");
    td.textContent = text;
    if (cls) td.className = cls;
    row.appendChild(td);
  }

  function render(m) {
    const ml = m.cv_grouped_by_clip, rule = m.rule_based_same_reps, tr = m.trained_on;

    const kpis = [
      [pct(ml.accuracy[0]), L("ความแม่นยำรวม", "Accuracy")],
      [num(ml.f1[0]), L("F1 (โมเดล)", "F1 (model)")],
      [String(tr.reps), L("ครั้งที่ใช้ทดสอบ", "Reps evaluated")],
      [String(tr.clips), L("คลิป", "Clips")],
      [modelKB + " KB", L("ขนาดโมเดล", "Model size")]
    ];
    const box = document.getElementById("kpis");
    box.textContent = "";
    for (const [v, l] of kpis) {
      const d = document.createElement("div"); d.className = "kpi";
      const a = document.createElement("div"); a.className = "v"; a.textContent = v;
      const b = document.createElement("div"); b.className = "l"; b.textContent = l;
      d.append(a, b); box.appendChild(d);
    }

    const rows = [
      ["precision", L("Precision (เตือนแล้วผิดจริง)", "Precision")],
      ["recall", L("Recall (จับท่าผิดได้)", "Recall")],
      ["f1", "F1"],
      ["accuracy", L("Accuracy (ความแม่นยำรวม)", "Accuracy")]
    ];
    const tb = document.getElementById("metrics");
    tb.textContent = "";
    for (const [key, label] of rows) {
      const tr2 = document.createElement("tr");
      cell(tr2, label);
      cell(tr2, num(rule[key]));
      cell(tr2, num(ml[key][0]) + " ± " + ml[key][1].toFixed(2), ml[key][0] > rule[key] ? "win" : "");
      tb.appendChild(tr2);
    }

    const info = [
      [L("ชนิดของโมเดล", "Model type"), "Random Forest (" + m.trees.length + L(" ต้น", " trees") + ")"],
      [L("คุณลักษณะต่อครั้ง", "Features per rep"), String(m.feature_names.length)],
      [L("รุ่น / วันที่สร้าง", "Version / built"), m.version + " · " + m.created],
      [L("จุดตัดตัดสิน", "Decision threshold"), String(m.threshold)],
      [L("สกัดคุณลักษณะด้วย", "Features extracted by"), m.trained_on.features_from],
      [L("ชุดข้อมูล", "Dataset"), m.trained_on.dataset]
    ];
    const dl = document.getElementById("modelInfo");
    dl.textContent = "";
    for (const [k, v] of info) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      dl.append(dt, dd);
    }
  }

  let model = null, modelKB = "–";
  fetch("model/pushup_rf.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => {
      modelKB = Math.round(new Blob([txt]).size / 1024);
      model = JSON.parse(txt);
      render(model);
    })
    .catch(() => {
      const e = document.getElementById("loadErr");
      e.hidden = false;
      e.textContent = L("โหลดไฟล์โมเดลไม่ได้ — ตัวเลขจึงยังไม่แสดง", "Could not load the model file, so the numbers are unavailable.");
    });

  applyLang();
</script>
</body>
</html>
